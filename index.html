<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>REP</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080a09;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

.app{
    width:min(100%,900px);
    margin:auto;
    padding:22px 18px 40px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.logo{
    font-size:28px;
    font-weight:800;
    letter-spacing:-1px;
}

.balance{
    background:#111713;
    border:1px solid #202a22;
    border-radius:14px;
    padding:10px 15px;
    color:#62c554;
    font-weight:700;
}

.subtitle{
    color:#777;
    margin-top:-15px;
    margin-bottom:22px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.card{
    background:#101311;
    border:1px solid #202521;
    border-radius:18px;
    padding:18px 12px;
    cursor:pointer;
    transition:.15s;
}

.card.active{
    border-color:#62c554;
    box-shadow:0 0 0 1px #62c554;
}

.card:hover{
    transform:translateY(-2px);
}

.card-title{
    font-size:17px;
    font-weight:700;
}

.card-time{
    margin-top:7px;
    color:#62c554;
    font-size:13px;
}

.camera{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#050505;
    border-radius:22px;
    overflow:hidden;
    border:1px solid #202521;
}

video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform:scaleX(-1);
    pointer-events:none;
    z-index:5;
}

.camera-message{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    z-index:2;
}

.controls{
    display:flex;
    gap:10px;
    margin-top:14px;
}

button{
    flex:1;
    border:0;
    border-radius:15px;
    padding:15px;
    color:#fff;
    background:#62c554;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

button.secondary{
    background:#171b18;
    border:1px solid #272d29;
}

button:active{
    transform:scale(.98);
}

.status{
    text-align:center;
    min-height:25px;
    margin-top:13px;
    color:#888;
}

.rep{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.7);
    font-size:100px;
    font-weight:900;
    color:#62c554;
    opacity:0;
    pointer-events:none;
    z-index:10;
}

.rep.show{
    animation:repPop .9s ease forwards;
}

@keyframes repPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}
}

.counter{
    text-align:center;
    font-size:68px;
    font-weight:900;
    margin-top:14px;
}

.profile{
    margin-top:25px;
    padding:18px;
    background:#101311;
    border:1px solid #202521;
    border-radius:18px;
}

.profile-title{
    color:#777;
    font-size:13px;
    margin-bottom:5px;
}

.profile-name{
    font-size:21px;
    font-weight:700;
}

@media(max-width:600px){
    .cards{
        grid-template-columns:1fr;
    }

    .counter{
        font-size:55px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">REP</div>
        <div class="balance">
            <span id="balance">0</span> мин
        </div>
    </div>

    <div class="subtitle">
        Earn Your Screen Time
    </div>

    <div class="cards">

        <div class="card active" id="pushupCard" onclick="selectExercise('pushup')">
            <div class="card-title">Отжимания</div>
            <div class="card-time">+1 мин / повтор</div>
        </div>

        <div class="card" id="squatCard" onclick="selectExercise('squat')">
            <div class="card-title">Приседания</div>
            <div class="card-time">+1 мин / повтор</div>
        </div>

        <div class="card" id="boxingCard" onclick="selectExercise('boxing')">
            <div class="card-title">BOX</div>
            <div class="card-time">Реакция</div>
        </div>

    </div>

    <div class="camera">

        <video id="video" autoplay muted playsinline></video>

        <canvas id="canvas"></canvas>

        <div class="camera-message" id="cameraMessage">
            Нажми «Запустить»
        </div>

        <div class="rep" id="repAnimation">+1</div>

    </div>

    <div class="counter" id="counter">0</div>

    <div class="status" id="status">
        Камера не запущена
    </div>

    <div class="controls">
        <button onclick="startCamera()">Запустить</button>
        <button class="secondary" onclick="resetCounter()">Сброс</button>
    </div>

    <div class="profile">
        <div class="profile-title">Профиль</div>
        <div class="profile-name" id="profileName">REP User</div>
    </div>

</div>


<!-- MediaPipe Pose -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const counterEl = document.getElementById("counter");
const balanceEl = document.getElementById("balance");
const statusEl = document.getElementById("status");
const messageEl = document.getElementById("cameraMessage");
const repAnimation = document.getElementById("repAnimation");

let counter = 0;
let balance = Number(localStorage.getItem("repBalance") || 0);

let selectedExercise = "pushup";

let pushupState = "up";
let squatState = "up";

let cameraStarted = false;
let lastRepTime = 0;

balanceEl.textContent = balance;


/* =========================
   ПРОФИЛЬ
========================= */

const savedName = localStorage.getItem("repName");

if(savedName){
    document.getElementById("profileName").textContent = savedName;
}


/* =========================
   МАТЕМАТИКА
========================= */

function distance(a,b){

    return Math.sqrt(
        (a.x-b.x)**2 +
        (a.y-b.y)**2
    );

}


function angle(a,b,c){

    const ab = {
        x:a.x-b.x,
        y:a.y-b.y
    };

    const cb = {
        x:c.x-b.x,
        y:c.y-b.y
    };

    const dot =
        ab.x*cb.x +
        ab.y*cb.y;

    const magAB =
        Math.sqrt(
            ab.x**2 +
            ab.y**2
        );

    const magCB =
        Math.sqrt(
            cb.x**2 +
            cb.y**2
        );

    if(!magAB || !magCB)
        return 180;

    let cos =
        dot/(magAB*magCB);

    cos = Math.max(-1,Math.min(1,cos));

    return Math.acos(cos)*180/Math.PI;
}


/* =========================
   СКЕЛЕТ
========================= */

/*
MediaPipe Pose landmarks

0 nose

11 left shoulder
12 right shoulder

13 left elbow
14 right elbow

15 left wrist
16 right wrist

23 left hip
24 right hip

25 left knee
26 right knee

27 left ankle
28 right ankle
*/

const CONNECTIONS = [

    [0,1],
    [1,2],
    [2,3],
    [3,7],

    [0,4],
    [4,5],
    [5,6],
    [6,8],

    [9,10],

    [11,12],

    [11,13],
    [13,15],

    [12,14],
    [14,16],

    [11,23],
    [12,24],

    [23,24],

    [23,25],
    [25,27],

    [24,26],
    [26,28],

    [27,29],
    [29,31],

    [28,30],
    [30,32]
];


function drawSkeleton(points){

    if(!points) return;

    /*
    ЛИНИИ
    */

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = "#62c554";

    for(const connection of CONNECTIONS){

        const a = points[connection[0]];
        const b = points[connection[1]];

        if(!a || !b) continue;

        if(
            (a.visibility ?? 1) < .35 ||
            (b.visibility ?? 1) < .35
        ) continue;

        ctx.beginPath();

        ctx.moveTo(
            a.x * canvas.width,
            a.y * canvas.height
        );

        ctx.lineTo(
            b.x * canvas.width,
            b.y * canvas.height
        );

        ctx.stroke();
    }


    /*
    ТОЧКИ
    */

    for(let i=0;i<points.length;i++){

        const p = points[i];

        if(!p) continue;

        if((p.visibility ?? 1) < .35)
            continue;

        const x = p.x * canvas.width;
        const y = p.y * canvas.height;

        let radius = 4;

        /*
        Основные суставы крупнее
        */

        if([
            11,12,
            13,14,
            15,16,
            23,24,
            25,26,
            27,28
        ].includes(i)){
            radius = 6;
        }

        /*
        Пальцы/мелкие точки меньше
        */

        if(i >= 29){
            radius = 2.5;
        }

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            i >= 29
            ? "#62c554"
            : "#ffffff";

        ctx.fill();
    }
}


/* =========================
   MEDIAPIPE
========================= */

const pose = new Pose({

    locateFile:(file)=>{

        return `
        https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}
        `;

    }

});


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    minDetectionConfidence:.5,

    minTrackingConfidence:.5

});


pose.onResults(results=>{

    /*
    Canvas всегда под размер камеры
    */

    if(video.videoWidth && video.videoHeight){

        if(
            canvas.width !== video.videoWidth ||
            canvas.height !== video.videoHeight
        ){

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;

        }

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
    ВОТ ЗДЕСЬ РИСУЕТСЯ СКЕЛЕТ
    */

    if(results.poseLandmarks){

        drawSkeleton(
            results.poseLandmarks
        );

        statusEl.textContent =
            "Тело распознано";

        statusEl.style.color =
            "#62c554";

        messageEl.style.display =
            "none";

    }else{

        statusEl.textContent =
            "Ищем человека";

        statusEl.style.color =
            "#888";

    }


    if(!results.poseLandmarks)
        return;


    const p =
        results.poseLandmarks;


    /* =========================
       ОТЖИМАНИЯ
    ========================= */

    if(selectedExercise === "pushup"){

        const leftShoulder = p[11];
        const rightShoulder = p[12];

        const leftElbow = p[13];
        const rightElbow = p[14];

        const leftWrist = p[15];
        const rightWrist = p[16];


        const visible =

            leftShoulder.visibility > .5 &&
            rightShoulder.visibility > .5 &&

            leftElbow.visibility > .5 &&
            rightElbow.visibility > .5 &&

            leftWrist.visibility > .5 &&
            rightWrist.visibility > .5;


        if(!visible){

            statusEl.textContent =
                "Встань дальше от камеры";

            return;

        }


        const leftAngle =
            angle(
                leftShoulder,
                leftElbow,
                leftWrist
            );


        const rightAngle =
            angle(
                rightShoulder,
                rightElbow,
                rightWrist
            );


        const elbowAngle =
            (leftAngle + rightAngle) / 2;


        /*
        РАБОЧАЯ ЛОГИКА ИЗ ТВОЕГО КОДА

        <105 = вниз

        >150 = вверх

        вниз -> вверх = повтор
        */

        if(elbowAngle > 150){

            if(pushupState === "down"){

                registerRep();

                pushupState = "up";

            }

        }

        else if(elbowAngle < 105){

            pushupState = "down";

        }

    }


    /* =========================
       ПРИСЕДАНИЯ
    ========================= */

    if(selectedExercise === "squat"){

        const visible = [

            23,24,
            25,26,
            27,28

        ].every(i =>
            p[i] &&
            (p[i].visibility ?? 1) > .5
        );


        if(!visible)
            return;


        const leftKnee =
            angle(
                p[23],
                p[25],
                p[27]
            );


        const rightKnee =
            angle(
                p[24],
                p[26],
                p[28]
            );


        const kneeAngle =
            (leftKnee + rightKnee) / 2;


        if(kneeAngle < 105){

            squatState = "down";

        }

        else if(
            kneeAngle > 155 &&
            squatState === "down"
        ){

            registerRep();

            squatState = "up";

        }

    }

});


/* =========================
   +1 ПОВТОР
========================= */

function registerRep(){

    const now = Date.now();

    if(now-lastRepTime < 700)
        return;

    lastRepTime = now;

    counter++;

    counterEl.textContent =
        counter;


    /*
    +1 минута
    */

    balance++;

    balanceEl.textContent =
        balance;

    localStorage.setItem(
        "repBalance",
        balance
    );


    /*
    Анимация +1
    */

    repAnimation.classList.remove("show");

    void repAnimation.offsetWidth;

    repAnimation.classList.add("show");

}


/* =========================
   ВЫБОР УПРАЖНЕНИЯ
========================= */

function selectExercise(exercise){

    selectedExercise =
        exercise;


    document
        .querySelectorAll(".card")
        .forEach(card =>
            card.classList.remove("active")
        );


    if(exercise === "pushup"){

        document
            .getElementById("pushupCard")
            .classList.add("active");

        statusEl.textContent =
            "Готов к отжиманиям";

    }


    if(exercise === "squat"){

        document
            .getElementById("squatCard")
            .classList.add("active");

        statusEl.textContent =
            "Готов к приседаниям";

    }


    if(exercise === "boxing"){

        document
            .getElementById("boxingCard")
            .classList.add("active");

        statusEl.textContent =
            "BOX скоро";

    }

}


/* =========================
   КАМЕРА
========================= */

async function startCamera(){

    if(cameraStarted)
        return;


    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }

                },

                audio:false

            });


        video.srcObject =
            stream;


        cameraStarted =
            true;


        await video.play();


        messageEl.style.display =
            "none";


        statusEl.textContent =
            "Ищем человека";


        processVideo();


    }catch(error){

        console.error(error);

        statusEl.textContent =
            "Нет доступа к камере";

    }

}


/* =========================
   КАДРЫ
========================= */

async function processVideo(){

    if(
        cameraStarted &&
        video.readyState >= 2
    ){

        try{

            await pose.send({
                image:video
            });

        }catch(error){

            console.error(
                "Pose:",
                error
            );

        }

    }


    requestAnimationFrame(
        processVideo
    );

}


/* =========================
   СБРОС
========================= */

function resetCounter(){

    counter = 0;

    pushupState = "up";

    squatState = "up";

    counterEl.textContent =
        "0";

    statusEl.textContent =
        "Счётчик сброшен";

}

</script>

</body>
</html>
