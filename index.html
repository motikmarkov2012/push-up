<script>
/* =====================================================
   DATA
===================================================== */

let profile = JSON.parse(localStorage.getItem("pushProfile")) || null;

let total = Number(localStorage.getItem("pushTotal") || 0);
let best = Number(localStorage.getItem("pushBest") || 0);
let today = Number(localStorage.getItem("pushToday") || 0);

let todayDate = localStorage.getItem("pushDate");

const currentDate = new Date().toDateString();

if (todayDate !== currentDate) {
    today = 0;
    localStorage.setItem("pushToday", "0");
    localStorage.setItem("pushDate", currentDate);
}


/* =====================================================
   DOM
===================================================== */

const startScreen = document.getElementById("startScreen");
const home = document.getElementById("home");
const workout = document.getElementById("workout");
const result = document.getElementById("result");
const profileScreen = document.getElementById("profile");

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const counter = document.getElementById("counter");
const exerciseLabel = document.getElementById("exerciseLabel");
const cameraHint = document.getElementById("cameraHint");


/* =====================================================
   SCREEN CONTROL
===================================================== */

function hideAll() {
    startScreen.style.display = "none";
    home.style.display = "none";
    workout.style.display = "none";
    result.style.display = "none";
    profileScreen.style.display = "none";
}


function showStart() {
    hideAll();
    startScreen.style.display = "flex";
}


function goHome() {
    hideAll();
    home.style.display = "block";
    updateHome();
}


/* =====================================================
   PROFILE
===================================================== */

function createProfile() {

    const name = document.getElementById("nameInput").value.trim();
    const level = document.getElementById("levelInput").value;

    if (!name) {
        document.getElementById("nameInput").focus();
        return;
    }

    profile = {
        name,
        level
    };

    localStorage.setItem(
        "pushProfile",
        JSON.stringify(profile)
    );

    goHome();
}


function updateHome() {

    if (!profile) return;

    document.getElementById("greetingName").textContent =
        profile.name;

    document.getElementById("profileName").textContent =
        profile.name;

    document.getElementById("profileLevel").textContent =
        profile.level;

    document.getElementById("profileAvatar").textContent =
        profile.name.charAt(0).toUpperCase();

    document.getElementById("profileButton").textContent =
        profile.name.charAt(0).toUpperCase();

    document.getElementById("totalStat").textContent = total;
    document.getElementById("bestStat").textContent = best;
    document.getElementById("todayStat").textContent = today;
}


function openProfile() {
    hideAll();
    profileScreen.style.display = "block";
}


function resetProfile() {

    if (!confirm("Сбросить профиль и статистику?")) {
        return;
    }

    localStorage.removeItem("pushProfile");
    localStorage.removeItem("pushTotal");
    localStorage.removeItem("pushBest");
    localStorage.removeItem("pushToday");
    localStorage.removeItem("pushDate");

    profile = null;
    total = 0;
    best = 0;
    today = 0;

    showStart();
}


/* =====================================================
   MEDIAPIPE
===================================================== */

let pose = null;

let cameraStream = null;

let currentExercise = null;

let reps = 0;

let previousState = "UP";

let lastRepTime = 0;

let lastPunch = null;
let lastPunchTime = 0;


/* =====================================================
   POSE SETUP
===================================================== */

pose = new Pose({
    locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }
});


pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    smoothSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});


pose.onResults(onPoseResults);


/* =====================================================
   START WORKOUT
===================================================== */

async function startWorkout(type) {

    currentExercise = type;

    reps = 0;
    previousState = "UP";
    lastRepTime = 0;
    lastPunch = null;
    lastPunchTime = 0;

    counter.textContent = "0";

    if (type === "pushup") {
        exerciseLabel.textContent = "Отжимания";
        cameraHint.textContent = "Встань лицом к камере";
    }

    if (type === "squat") {
        exerciseLabel.textContent = "Приседания";
        cameraHint.textContent = "Встань полностью в кадр";
    }

    if (type === "boxing") {
        exerciseLabel.textContent = "Speed Box";
        cameraHint.textContent = "Бей поочерёдно левой и правой";
    }

    hideAll();

    workout.style.display = "block";

    try {

        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: {
                    ideal: 1280
                },
                height: {
                    ideal: 720
                }
            },
            audio: false
        });

        video.srcObject = cameraStream;

        await video.play();

        processCamera();

    } catch (error) {

        alert(
            "Не удалось открыть камеру.\n\n" +
            "Разреши доступ к камере и попробуй снова."
        );

        stopWorkout();
    }
}


/* =====================================================
   CAMERA LOOP
===================================================== */

let processing = false;

async function processCamera() {

    if (
        workout.style.display !== "block" ||
        !cameraStream
    ) {
        return;
    }

    if (!processing) {

        processing = true;

        try {
            await pose.send({
                image: video
            });
        } catch (e) {
            console.log(e);
        }

        processing = false;
    }

    requestAnimationFrame(processCamera);
}


/* =====================================================
   POSE RESULTS
===================================================== */

function onPoseResults(results) {

    if (workout.style.display !== "block") {
        return;
    }

    if (!results.poseLandmarks) {
        return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawConnectors(
        ctx,
        results.poseLandmarks,
        POSE_CONNECTIONS,
        {
            color: "#42e875",
            lineWidth: 4
        }
    );

    drawLandmarks(
        ctx,
        results.poseLandmarks,
        {
            color: "#ffffff",
            fillColor: "#42e875",
            lineWidth: 1,
            radius: 4
        }
    );


    if (currentExercise === "pushup") {
        detectPushups(results.poseLandmarks);
    }

    if (currentExercise === "squat") {
        detectSquats(results.poseLandmarks);
    }

    if (currentExercise === "boxing") {
        detectBoxing(results.poseLandmarks);
    }
}


/* =====================================================
   MATH
===================================================== */

function distance(a, b) {

    return Math.sqrt(
        Math.pow(a.x - b.x, 2) +
        Math.pow(a.y - b.y, 2)
    );
}


function angle(a, b, c) {

    const ab = {
        x: a.x - b.x,
        y: a.y - b.y
    };

    const cb = {
        x: c.x - b.x,
        y: c.y - b.y
    };

    const dot =
        ab.x * cb.x +
        ab.y * cb.y;

    const magAB =
        Math.sqrt(
            ab.x * ab.x +
            ab.y * ab.y
        );

    const magCB =
        Math.sqrt(
            cb.x * cb.x +
            cb.y * cb.y
        );

    if (!magAB || !magCB) {
        return 180;
    }

    let cosine =
        dot / (magAB * magCB);

    cosine = Math.max(
        -1,
        Math.min(1, cosine)
    );

    return Math.acos(cosine) * 180 / Math.PI;
}


/* =====================================================
   PUSH-UP DETECTION
===================================================== */

function detectPushups(lm) {

    const leftShoulder = lm[11];
    const rightShoulder = lm[12];

    const leftElbow = lm[13];
    const rightElbow = lm[14];

    const leftWrist = lm[15];
    const rightWrist = lm[16];

    if (
        !leftShoulder ||
        !rightShoulder ||
        !leftElbow ||
        !rightElbow ||
        !leftWrist ||
        !rightWrist
    ) {
        return;
    }

    const leftAngle =
        angle(
            leftShoulder,
            leftElbow,
            leftWrist
        );

    const rightAngle =
        angle(
            rightShoulder,
            rightElbow,
            rightWrist
        );

    const avgAngle =
        (leftAngle + rightAngle) / 2;


    if (avgAngle < 105) {

        previousState = "DOWN";

    } else if (
        avgAngle > 150 &&
        previousState === "DOWN"
    ) {

        countRep(700);

        previousState = "UP";
    }
}


/* =====================================================
   SQUAT DETECTION
===================================================== */

function detectSquats(lm) {

    const leftHip = lm[23];
    const rightHip = lm[24];

    const leftKnee = lm[25];
    const rightKnee = lm[26];

    const leftAnkle = lm[27];
    const rightAnkle = lm[28];

    if (
        !leftHip ||
        !rightHip ||
        !leftKnee ||
        !rightKnee ||
        !leftAnkle ||
        !rightAnkle
    ) {
        return;
    }

    const leftAngle =
        angle(
            leftHip,
            leftKnee,
            leftAnkle
        );

    const rightAngle =
        angle(
            rightHip,
            rightKnee,
            rightAnkle
        );

    const avgAngle =
        (leftAngle + rightAngle) / 2;


    if (avgAngle < 105) {

        previousState = "DOWN";

    } else if (
        avgAngle > 155 &&
        previousState === "DOWN"
    ) {

        countRep(550);

        previousState = "UP";
    }
}


/* =====================================================
   BOXING DETECTION
===================================================== */

function detectBoxing(lm) {

    const leftShoulder = lm[11];
    const rightShoulder = lm[12];

    const leftElbow = lm[13];
    const rightElbow = lm[14];

    const leftWrist = lm[15];
    const rightWrist = lm[16];

    if (
        !leftShoulder ||
        !rightShoulder ||
        !leftElbow ||
        !rightElbow ||
        !leftWrist ||
        !rightWrist
    ) {
        return;
    }

    const shoulderWidth =
        distance(
            leftShoulder,
            rightShoulder
        );

    if (shoulderWidth <= 0) {
        return;
    }


    const leftAngle =
        angle(
            leftShoulder,
            leftElbow,
            leftWrist
        );

    const rightAngle =
        angle(
            rightShoulder,
            rightElbow,
            rightWrist
        );


    const leftExtension =
        distance(
            leftShoulder,
            leftWrist
        ) / shoulderWidth;

    const rightExtension =
        distance(
            rightShoulder,
            rightWrist
        ) / shoulderWidth;


    const leftPunch =
        leftAngle > 150 &&
        leftExtension > 0.72;

    const rightPunch =
        rightAngle > 150 &&
        rightExtension > 0.72;


    const now = Date.now();


    if (
        leftPunch &&
        lastPunch !== "left" &&
        now - lastPunchTime > 230
    ) {

        reps++;
        lastPunch = "left";
        lastPunchTime = now;

        updateCounter();

    } else if (
        rightPunch &&
        lastPunch !== "right" &&
        now - lastPunchTime > 230
    ) {

        reps++;
        lastPunch = "right";
        lastPunchTime = now;

        updateCounter();
    }
}


/* =====================================================
   REP COUNTER
===================================================== */

function countRep(cooldown) {

    const now = Date.now();

    if (
        now - lastRepTime < cooldown
    ) {
        return;
    }

    lastRepTime = now;

    reps++;

    updateCounter();
}


function updateCounter() {

    counter.textContent = reps;

    counter.classList.remove("pop");

    void counter.offsetWidth;

    counter.classList.add("pop");
}


/* =====================================================
   STOP WORKOUT
===================================================== */

function stopWorkout() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(track => track.stop());

        cameraStream = null;
    }

    video.srcObject = null;

    workout.style.display = "none";

    showResult();
}


/* =====================================================
   RESULT
===================================================== */

function showResult() {

    total += reps;
    today += reps;

    if (reps > best) {
        best = reps;
    }

    localStorage.setItem(
        "pushTotal",
        total
    );

    localStorage.setItem(
        "pushToday",
        today
    );

    localStorage.setItem(
        "pushBest",
        best
    );

    localStorage.setItem(
        "pushDate",
        new Date().toDateString()
    );

    document.getElementById("resultNumber")
        .textContent = reps;

    hideAll();

    result.style.display = "flex";
}


/* =====================================================
   INITIALIZATION
===================================================== */

if (profile) {

    updateHome();
    goHome();

} else {

    showStart();
}

===================================================== */

document
    .getElementById("nameInput")
    .addEventListener("keydown", function(e) {

        if (e.key === "Enter") {
            createProfile();
        }

    });
