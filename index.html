```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUSH.</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #080b09;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: min(90%, 380px);
    text-align: center;
}

.logo {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -3px;
    margin-bottom: 18px;
}

.tag {
    display: inline-block;
    padding: 11px 18px;
    border: 1px solid #26372c;
    background: #101711;
    border-radius: 999px;
    color: #b9c8bd;
    font-size: 15px;
    margin-bottom: 45px;
}

input,
select {
    width: 100%;
    height: 56px;
    border: 1px solid #29352d;
    background: #111612;
    color: white;
    border-radius: 17px;
    padding: 0 18px;
    font-size: 16px;
    outline: none;
    margin-bottom: 12px;
}

input:focus,
select:focus {
    border-color: #48e879;
}

select {
    appearance: none;
}

button {
    width: 100%;
    height: 58px;
    border: none;
    border-radius: 18px;
    background: #42e875;
    color: #061008;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
}

button:active {
    transform: scale(0.98);
}

@media (max-width: 500px) {
    .logo {
        font-size: 46px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">PUSH.</div>

    <div class="tag">Дави и радуйся.</div>

    <input id="name" type="text" placeholder="Имя">

    <select id="level">
        <option value="Новичок">Новичок</option>
        <option value="Средний">Средний</option>
        <option value="Продвинутый">Продвинутый</option>
    </select>

    <button onclick="start()">Начать</button>

</div>

<script>
function start() {
    const name = document.getElementById("name").value.trim();
    const level = document.getElementById("level").value;

    if (!name) {
        document.getElementById("name").focus();
        return;
    }

    localStorage.setItem("pushProfile", JSON.stringify({
        name: name,
        level: level
    }));

    alert("Погнали, " + name + " 💪");
}
</script>

</body>
</html>
