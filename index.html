<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>PUSH.</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #070907;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* =====================
   START
===================== */

#start {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.startBox {
    width: min(90%, 380px);
    text-align: center;
}

.logo {
    font-size: 58px;
    font-weight: 900;
    letter-spacing: -4px;
    margin-bottom: 18px;
}

.subtitle {
    color: #aab4ac;
    margin-bottom: 35px;
}

.startButton {
    width: 100%;
    height: 60px;
    border: 0;
    border-radius: 18px;
    background: #42e875;
    color: #061008;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
}

.startButton:active {
    transform: scale(.98);
}

/* =====================
   CAMERA
===================== */

#cameraScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
}

#video {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);
}

#canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    transform: scaleX(-1);
}

/* =====================
   UI
===================== */

.top {
    position: absolute;
    top: 25px;
    left: 0;
    right: 0;

    text-align: center;

    z-index: 10;

    pointer-events: none;
}

.status {
    display: inline-block;

    padding: 12px 20px;

    border-radius: 999px;

    background: rgba(0,0,0,.55);
    backdrop-filter: blur(10px);

    font-size: 16px;
}

.jumpCounter {
    margin-top: 15px;

    font-size: 55px;
    font-weight: 900;

    text-shadow: 0 3px 15px black;
}

.flash {
    position: absolute;
    inset: 0;

    background: rgba(66,232,117,.12);

    opacity: 0;

    pointer-events: none;

    z-index: 5;
}

.flash.active {
    animation: flash .15s ease;
}

@keyframes flash {
    0% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

.exit {
    position: absolute;

    top: 20px;
    left: 20px;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.2);

    background: rgba(0,0,0,.5);

    color: white;

    font-size: 22px;

    z-index: 20;
}

/* =====================
   CALIBRATION
===================== */

#calibration {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 15;

    pointer-events: none;
}

.calibrationBox {
    width: min(90%, 400px);

    text-align: center;

    padding: 25px;

    border-radius: 25px;

    background: rgba(0,0,0,.7);

    backdrop-filter: blur(15px);
}

.calibrationTitle {
    font-size: 25px;
    font-weight: 800;
    margin-bottom: 10px;
}

.calibrationText {
    color: #aeb8b0;
    line-height: 1.4;
}
</style>
</head>

<body>

<!-- =====================
     START
===================== -->

<div id="start">

    <div class="startBox">

        <div class="logo">
            PUSH.
        </div>

        <div class="subtitle">
            Прыгни — и слушай.
        </div>

        <button class="startButton"
                onclick="startCamera()">
            Запустить
        </button>

    </div>

</div>


<!-- =====================
     CAMERA
===================== -->

<div id="cameraScreen">

    <video id="video"
           autoplay
           playsinline
           muted></video>

    <canvas id="canvas"></canvas>

    <div class="flash" id="flash"></div>

    <button class="exit"
            onclick="stopCamera()">
        ×
    </button>

    <div class="top">

        <div class="status"
             id="status">
            Подготовка...
        </div>

        <div class="jumpCounter"
             id="jumpCounter">
            0
        </div>

    </div>


    <div id="calibration">

        <div class="calibrationBox">

            <div class="calibrationTitle">
                Калибровка
            </div>

            <div class="calibrationText">
                Подпрыгни пару раз.<br>
                После этого можно начинать.
            </div>

        </div>

    </div>

</div>


<!-- =====================
     SOUND
===================== -->

<audio id="sound"
       src="ne_govori.mp3"
       preload="auto"></audio>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const start = document.getElementById("start");

const cameraScreen =
    document.getElementById("cameraScreen");

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const status =
    document.getElementById("status");

const jumpCounter =
    document.getElementById("jumpCounter");

const calibration =
    document.getElementById("calibration");

const sound =
    document.getElementById("sound");

const flash =
    document.getElementById("flash");


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let pose = null;

let processing = false;

let running = false;

let calibrated = false;

let jumps = 0;


/*
    Значение высоты тела,
    когда человек стоит.

    Используется как базовая линия.
*/

let baseY = null;


/*
    Состояние прыжка:

    false = на земле
    true  = в воздухе
*/

let inAir = false;


/*
    Защита от случайных срабатываний.
*/

let lastJumpTime = 0;


/* =====================================================
   MEDIAPIPE
===================================================== */

pose = new Pose({

    locateFile: function(file) {

        return
        `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;

    }

});


pose.setOptions({

    modelComplexity: 1,

    smoothLandmarks: true,

    enableSegmentation: false,

    smoothSegmentation: false,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


pose.onResults(onResults);


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: "user",

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        video.srcObject = stream;

        await video.play();


        start.style.display = "none";

        cameraScreen.style.display = "block";


        running = true;

        calibrated = false;

        inAir = false;

        baseY = null;

        jumps = 0;

        jumpCounter.textContent = "0";


        status.textContent =
            "Подпрыгни пару раз";


        calibration.style.display =
            "flex";


        processFrame();


    } catch (error) {

        alert(
            "Не получилось открыть камеру.\n\n" +
            "Разреши доступ к камере."
        );

    }

}


/* =====================================================
   CAMERA LOOP
===================================================== */

async function processFrame() {

    if (!running) {
        return;
    }


    if (!processing) {

        processing = true;

        try {

            await pose.send({
                image: video
            });

        } catch (error) {

            console.log(error);

        }

        processing = false;

    }


    requestAnimationFrame(processFrame);

}


/* =====================================================
   POSE RESULTS
===================================================== */

function onResults(results) {

    if (!running) {
        return;
    }


    if (!results.poseLandmarks) {
        return;
    }


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
        Рисуем скелет.
    */

    drawConnectors(

        ctx,

        results.poseLandmarks,

        POSE_CONNECTIONS,

        {

            color: "#42e875",

            lineWidth: 5

        }

    );


    drawLandmarks(

        ctx,

        results.poseLandmarks,

        {

            color: "#ffffff",

            fillColor: "#42e875",

            lineWidth: 1,

            radius: 5

        }

    );


    detectJump(
        results.poseLandmarks
    );

}


/* =====================================================
   JUMP DETECTION
===================================================== */

function detectJump(lm) {

    /*
        Берём плечи и таз.

        Средняя точка тела значительно
        надёжнее одной точки.
    */

    const leftShoulder = lm[11];
    const rightShoulder = lm[12];

    const leftHip = lm[23];
    const rightHip = lm[24];

    const leftAnkle = lm[27];
    const rightAnkle = lm[28];


    if (
        !leftShoulder ||
        !rightShoulder ||
        !leftHip ||
        !rightHip ||
        !leftAnkle ||
        !rightAnkle
    ) {
        return;
    }


    /*
        Центр таза.
    */

    const hipY =
        (leftHip.y + rightHip.y) / 2;


    /*
        Высота ступней.
    */

    const ankleY =
        (leftAnkle.y + rightAnkle.y) / 2;


    /*
        Высота плеч.
    */

    const shoulderY =
        (leftShoulder.y +
         rightShoulder.y) / 2;


    /*
        Размер тела.
    */

    const bodyHeight =
        Math.abs(
            ankleY - shoulderY
        );


    if (bodyHeight < 0.1) {
        return;
    }


    /*
        Положение тела относительно ног.

        Когда человек прыгает,
        таз и плечи поднимаются
        относительно положения ног.
    */

    const bodyCenter =
        (shoulderY + hipY) / 2;


    /*
        ============================
        КАЛИБРОВКА
        ============================
    */

    if (!calibrated) {

        if (baseY === null) {

            baseY = bodyCenter;

            return;

        }


        /*
            Сколько человек поднялся.

            0.10 = примерно 10%
            высоты тела.
        */

        const rise =
            baseY - bodyCenter;


        /*
            Если человек поднялся
            достаточно высоко — прыжок.
        */

        if (rise > bodyHeight * 0.10) {

            if (!inAir) {

                inAir = true;

            }

        } else {

            /*
                Вернулся вниз после прыжка.
            */

            if (inAir) {

                calibrated = true;

                inAir = false;

                calibration.style.display =
                    "none";

                status.textContent =
                    "Готово";

                /*
                    Первый калибровочный
                    прыжок НЕ считается.
                */

            }

        }


        /*
            Медленно обновляем
            базовое положение.
        */

        baseY =
            baseY * 0.97 +
            bodyCenter * 0.03;


        return;
    }


    /*
        ============================
        РАБОЧИЙ РЕЖИМ
        ============================
    */

    const rise =
        baseY - bodyCenter;


    /*
        Порог прыжка.

        Можно изменить:

        0.10 = чувствительнее
        0.15 = строже
        0.20 = очень строго
    */

    const jumpThreshold =
        bodyHeight * 0.12;


    /*
        В воздухе.
    */

    if (rise > jumpThreshold) {

        if (!inAir) {

            inAir = true;

        }

    }


    /*
        Вернулся вниз.
    */

    else if (
        rise < jumpThreshold * 0.35
    ) {

        if (inAir) {

            inAir = false;

            registerJump();

        }

    }


    /*
        Очень медленно подстраиваем
        базовую высоту.

        Это позволяет системе
        работать даже если человек
        немного двигается по комнате.
    */

    baseY =
        baseY * 0.995 +
        bodyCenter * 0.005;

}


/* =====================================================
   REGISTER JUMP
===================================================== */

function registerJump() {

    const now = Date.now();


    /*
        Если два события пришли
        практически одновременно —
        игнорируем второе.
    */

    if (
        now - lastJumpTime < 150
    ) {
        return;
    }


    lastJumpTime = now;


    jumps++;


    jumpCounter.textContent =
        jumps;


    /*
        Анимация счётчика.
    */

    jumpCounter.animate(

        [

            {
                transform: "scale(1)"
            },

            {
                transform: "scale(1.35)"
            },

            {
                transform: "scale(1)"
            }

        ],

        {

            duration: 220,

            easing: "ease-out"

        }

    );


    /*
        Короткая вспышка.
    */

    flash.classList.remove("active");

    void flash.offsetWidth;

    flash.classList.add("active");


    /*
        ГЛАВНОЕ:
        звук запускается сразу после
        распознавания прыжка.
    */

    playSound();

}


/* =====================================================
   SOUND
===================================================== */

function playSound() {

    /*
        Перезапускаем звук с начала.

        Поэтому каждый новый прыжок
        начинает "Не говори." заново.
    */

    sound.pause();

    sound.currentTime = 0;


    sound.play().catch(error => {

        console.log(
            "Браузер заблокировал звук:",
            error
        );

    });

}


/* =====================================================
   STOP
===================================================== */

function stopCamera() {

    running = false;


    if (stream) {

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        stream = null;

    }


    video.srcObject = null;


    cameraScreen.style.display =
        "none";

    start.style.display =
        "flex";


    calibration.style.display =
        "flex";

    status.textContent =
        "Подпрыгни пару раз";

    jumps = 0;

    jumpCounter.textContent =
        "0";

    baseY = null;

    inAir = false;

    calibrated = false;

}

</script>

</body>
</html>
