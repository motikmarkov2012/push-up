```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PUSH.</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#start {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

#startButton {
    width: 220px;
    height: 64px;
    border: none;
    border-radius: 18px;
    background: #42e875;
    color: #061008;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
}

#camera {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
}

#video, #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

#counter {
    position: absolute;
    top: 25px;
    left: 0;
    right: 0;
    text-align: center;
    color: white;
    font-size: 52px;
    font-weight: 900;
    text-shadow: 0 3px 15px #000;
    z-index: 10;
}

#instruction {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    border-radius: 999px;
    background: rgba(0,0,0,.6);
    color: white;
    font-size: 16px;
    white-space: nowrap;
    z-index: 15;
}

#exit {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 45px;
    height: 45px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;
    background: rgba(0,0,0,.5);
    color: white;
    font-size: 24px;
    z-index: 20;
}
</style>
</head>

<body>

<div id="start">
    <button id="startButton">Запустить</button>
</div>

<div id="camera">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="counter">0</div>
    <div id="instruction">Сделай небольшой прыжок</div>
    <button id="exit">×</button>
</div>

<audio id="sound" src="./ne_govori.mp3" preload="auto"></audio>

<script>
const start = document.getElementById("start");
const camera = document.getElementById("camera");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const counter = document.getElementById("counter");
const instruction = document.getElementById("instruction");
const sound = document.getElementById("sound");

let stream = null;
let running = false;
let processing = false;
let calibrated = false;
let baseY = null;
let inAir = false;
let jumps = 0;
let lastJump = 0;
let animationId = null;

const pose = new Pose({
    locateFile: file =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

pose.onResults(results => {
    if (!running || !results.poseLandmarks) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {
        color: "#42e875",
        lineWidth: 5
    });

    drawLandmarks(ctx, results.poseLandmarks, {
        color: "#ffffff",
        fillColor: "#42e875",
        lineWidth: 1,
        radius: 5
    });

    detectJump(results.poseLandmarks);
});

document.getElementById("startButton").onclick = async () => {
    try {
        // Разрешаем аудио после пользовательского нажатия.
        sound.muted = true;
        await sound.play();
        sound.pause();
        sound.currentTime = 0;
        sound.muted = false;

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        });

        video.srcObject = stream;
        await video.play();

        start.style.display = "none";
        camera.style.display = "block";

        running = true;
        calibrated = false;
        baseY = null;
        inAir = false;
        jumps = 0;
        lastJump = 0;

        counter.textContent = "0";
        instruction.textContent = "Сделай небольшой прыжок";

        processFrame();
    } catch (error) {
        console.error(error);
        alert("Не удалось запустить камеру или подготовить звук. Проверь разрешения и файл ne_govori.mp3.");
    }
};

async function processFrame() {
    if (!running) return;

    if (!processing) {
        processing = true;
        try {
            await pose.send({ image: video });
        } catch (error) {
            console.error(error);
        }
        processing = false;
    }

    if (running) animationId = requestAnimationFrame(processFrame);
}

function detectJump(lm) {
    const ids = [11, 12, 23, 24, 27, 28];
    if (ids.some(i => !lm[i] || lm[i].visibility < 0.45)) return;

    const shoulderY = (lm[11].y + lm[12].y) / 2;
    const hipY = (lm[23].y + lm[24].y) / 2;
    const ankleY = (lm[27].y + lm[28].y) / 2;
    const bodyCenter = (shoulderY + hipY) / 2;
    const bodyHeight = Math.abs(ankleY - shoulderY);

    if (bodyHeight < 0.1) return;

    if (baseY === null) {
        baseY = bodyCenter;
        return;
    }

    const rise = baseY - bodyCenter;
    const threshold = bodyHeight * 0.055;

    // Первый прыжок используется для калибровки.
    if (!calibrated) {
        if (rise > threshold) {
            inAir = true;
        } else if (inAir && rise < threshold * 0.35) {
            calibrated = true;
            inAir = false;
            baseY = bodyCenter;
            instruction.style.display = "none";
        }

        baseY = baseY * 0.97 + bodyCenter * 0.03;
        return;
    }

    // Отрыв от земли.
    if (rise > threshold) {
        inAir = true;
    }

    // Приземление: считаем прыжок и проигрываем звук.
    else if (inAir && rise < threshold * 0.35) {
        inAir = false;
        registerJump();
    }

    baseY = baseY * 0.995 + bodyCenter * 0.005;
}

function registerJump() {
    const now = performance.now();
    if (now - lastJump < 250) return;
    lastJump = now;

    jumps++;
    counter.textContent = jumps;

    counter.animate(
        [
            { transform: "scale(1)" },
            { transform: "scale(1.35)" },
            { transform: "scale(1)" }
        ],
        { duration: 180, easing: "ease-out" }
    );

    playSound();
}

function playSound() {
    sound.pause();
    sound.currentTime = 0;

    sound.play().catch(error => {
        console.error("Не удалось воспроизвести MP3:", error);
    });
}

function stopCamera() {
    running = false;

    if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    video.srcObject = null;
    sound.pause();
    sound.currentTime = 0;

    camera.style.display = "none";
    start.style.display = "flex";
    instruction.style.display = "block";

    calibrated = false;
    baseY = null;
    inAir = false;
    jumps = 0;
    counter.textContent = "0";
}

document.getElementById("exit").onclick = stopCamera;
</script>

</body>
</html>
