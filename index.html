<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Push-Up</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #070707;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    overflow-x: hidden;
}

/* =========================
   APP
========================= */

.app {
    min-height: 100vh;
    width: 100%;
}

/* =========================
   REGISTRATION
========================= */

.screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.register-card {
    width: 100%;
    max-width: 430px;
}

.logo {
    text-align: center;
    font-size: 46px;
    margin-bottom: 8px;
}

.title {
    text-align: center;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1px;
}

.subtitle {
    text-align: center;
    color: #858585;
    margin-top: 8px;
    margin-bottom: 34px;
}

.input-label {
    display: block;
    color: #aaa;
    font-size: 14px;
    margin: 0 0 8px 4px;
}

input,
select {
    width: 100%;
    height: 56px;
    border: 1px solid #292929;
    background: #141414;
    color: white;
    border-radius: 16px;
    padding: 0 17px;
    font-size: 17px;
    outline: none;
    margin-bottom: 18px;
}

input:focus,
select:focus {
    border-color: #3b82f6;
}

.primary-button {
    width: 100%;
    height: 56px;
    border: none;
    border-radius: 17px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
}

.primary-button:active {
    transform: scale(0.98);
}

/* =========================
   MAIN APP
========================= */

#mainScreen {
    display: none;
    min-height: 100vh;
    padding-bottom: 30px;
}

.topbar {
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

.brand {
    font-size: 21px;
    font-weight: 800;
}

.profile-button {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid #292929;
    background: #151515;
    color: white;
    font-weight: 700;
    font-size: 16px;
}

/* =========================
   CAMERA
========================= */

.camera-container {
    position: relative;
    width: calc(100% - 24px);
    max-width: 720px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 24px;
    background: #111;
    border: 1px solid #222;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

video {
    width: 100%;
    display: block;
    transform: scaleX(-1);
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
    pointer-events: none;
}

/* =========================
   COUNTER
========================= */

.counter-overlay {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;

    min-width: 86px;
    height: 58px;

    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.48);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px;

    font-size: 31px;
    font-weight: 800;

    transition:
        transform .18s ease,
        background .18s ease;
}

.counter-overlay.pop {
    animation: counterPop .32s ease;
}

@keyframes counterPop {
    0% {
        transform: translateX(-50%) scale(1);
    }

    45% {
        transform: translateX(-50%) scale(1.18);
        background: rgba(37,99,235,.75);
    }

    100% {
        transform: translateX(-50%) scale(1);
    }
}

/* =========================
   +1 ANIMATION
========================= */

.rep-animation {
    position: absolute;
    left: 50%;
    top: 88px;
    transform: translateX(-50%);

    font-size: 26px;
    font-weight: 800;

    opacity: 0;
    pointer-events: none;

    z-index: 11;
}

.rep-animation.show {
    animation: repFloat .7s ease-out;
}

@keyframes repFloat {
    0% {
        opacity: 0;
        transform: translate(-50%, 15px) scale(.8);
    }

    25% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -35px) scale(1.05);
    }
}

/* =========================
   STATUS
========================= */

.status {
    text-align: center;
    margin: 14px 0 12px;
    color: #858585;
    min-height: 22px;
    font-size: 15px;
}

.status.ready {
    color: #35e36f;
}

.status.down {
    color: #ffd43b;
}

.status.up {
    color: #35e36f;
}

/* =========================
   CONTROLS
========================= */

.controls {
    width: calc(100% - 30px);
    max-width: 720px;
    margin: 0 auto;
}

.main-button {
    width: 100%;
    height: 56px;
    border: none;
    border-radius: 17px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: 700;
}

.main-button.stop {
    background: #242424;
}

.secondary-button {
    width: 100%;
    height: 48px;
    border: 1px solid #292929;
    border-radius: 15px;
    background: #111;
    color: #aaa;
    margin-top: 10px;
    font-size: 15px;
}

/* =========================
   STATS
========================= */

.stats {
    width: calc(100% - 30px);
    max-width: 720px;
    margin: 18px auto 0;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.stat {
    background: #111;
    border: 1px solid #202020;
    border-radius: 17px;
    padding: 16px 8px;
    text-align: center;
}

.stat-value {
    font-size: 21px;
    font-weight: 800;
}

.stat-label {
    color: #777;
    font-size: 12px;
    margin-top: 4px;
}

/* =========================
   PROFILE PANEL
========================= */

.profile-panel {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    z-index: 100;
    padding: 20px;

    align-items: flex-end;
}

.profile-card {
    width: 100%;
    max-width: 500px;
    margin: auto;

    background: #151515;
    border: 1px solid #292929;
    border-radius: 25px;
    padding: 24px;
}

.profile-card h2 {
    margin-top: 0;
}

.profile-row {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #252525;
}

.profile-row:last-child {
    border-bottom: none;
}

.profile-row span:first-child {
    color: #888;
}

.close-button {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 15px;
    background: #292929;
    color: white;
    margin-top: 18px;
    font-size: 16px;
}

/* =========================
   HIDDEN
========================= */

.hidden {
    display: none !important;
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 800px) {

    .camera-container {
        max-height: 75vh;
    }

}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     REGISTRATION
========================= -->

<section id="registrationScreen" class="screen">

    <div class="register-card">

        <div class="logo">💪</div>

        <div class="title">
            Push-Up
        </div>

        <div class="subtitle">
            Твой персональный счётчик тренировок
        </div>

        <label class="input-label">
            Как тебя зовут?
        </label>

        <input
            id="nameInput"
            type="text"
            placeholder="Например, Матвей"
            maxlength="30"
        >

        <label class="input-label">
            Уровень подготовки
        </label>

        <select id="levelInput">
            <option value="Новичок">Новичок</option>
            <option value="Средний">Средний</option>
            <option value="Продвинутый">Продвинутый</option>
        </select>

        <button
            class="primary-button"
            onclick="createProfile()"
        >
            Продолжить
        </button>

    </div>

</section>


<!-- =========================
     MAIN SCREEN
========================= -->

<section id="mainScreen">

    <header class="topbar">

        <div class="brand">
            Push-Up
        </div>

        <button
            class="profile-button"
            onclick="openProfile()"
            id="profileButton"
        >
            М
        </button>

    </header>


    <div class="camera-container">

        <video
            id="video"
            autoplay
            playsinline
        ></video>

        <canvas id="canvas"></canvas>

        <!-- COUNTER -->
        <div
            class="counter-overlay"
            id="counter"
        >
            0
        </div>

        <!-- +1 -->
        <div
            class="rep-animation"
            id="repAnimation"
        >
            +1
        </div>

    </div>


    <div
        class="status"
        id="status"
    >
        Нажми «Начать тренировку»
    </div>


    <div class="controls">

        <button
            class="main-button"
            id="startButton"
            onclick="startWorkout()"
        >
            Начать тренировку
        </button>

        <button
            class="secondary-button"
            onclick="resetCounter()"
        >
            Сбросить результат
        </button>

    </div>


    <div class="stats">

        <div class="stat">

            <div
                class="stat-value"
                id="todayReps"
            >
                0
            </div>

            <div class="stat-label">
                Сегодня
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-value"
                id="bestReps"
            >
                0
            </div>

            <div class="stat-label">
                Рекорд
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-value"
                id="totalReps"
            >
                0
            </div>

            <div class="stat-label">
                Всего
            </div>

        </div>

    </div>

</section>


<!-- =========================
     PROFILE
========================= -->

<div
    class="profile-panel"
    id="profilePanel"
>

    <div class="profile-card">

        <h2>Профиль</h2>

        <div class="profile-row">
            <span>Имя</span>
            <span id="profileName">—</span>
        </div>

        <div class="profile-row">
            <span>Уровень</span>
            <span id="profileLevel">—</span>
        </div>

        <div class="profile-row">
            <span>Всего отжиманий</span>
            <span id="profileTotal">0</span>
        </div>

        <button
            class="close-button"
            onclick="closeProfile()"
        >
            Закрыть
        </button>

    </div>

</div>


<!-- =========================
     MEDIAPIPE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>


<script>

/* =====================================================
   PROFILE
===================================================== */

let profile = JSON.parse(
    localStorage.getItem("pushupProfile")
);

let totalReps =
    Number(localStorage.getItem("pushupTotal") || 0);

let bestReps =
    Number(localStorage.getItem("pushupBest") || 0);

let todayReps =
    Number(localStorage.getItem("pushupToday") || 0);


/*
    Проверяем профиль
*/

if (profile) {

    showMainScreen();

}


/*
    Создание профиля
*/

function createProfile() {

    const name =
        document.getElementById("nameInput")
        .value
        .trim();

    const level =
        document.getElementById("levelInput")
        .value;

    if (!name) {

        alert("Введи своё имя");

        return;
    }


    profile = {
        name: name,
        level: level
    };


    localStorage.setItem(
        "pushupProfile",
        JSON.stringify(profile)
    );


    showMainScreen();
}


/*
    Показываем приложение
*/

function showMainScreen() {

    document.getElementById(
        "registrationScreen"
    ).style.display = "none";

    document.getElementById(
        "mainScreen"
    ).style.display = "block";


    updateProfileUI();
    updateStats();
}


/*
    Профиль
*/

function updateProfileUI() {

    if (!profile)
        return;

    document.getElementById(
        "profileButton"
    ).textContent =
        profile.name
        .charAt(0)
        .toUpperCase();

    document.getElementById(
        "profileName"
    ).textContent =
        profile.name;

    document.getElementById(
        "profileLevel"
    ).textContent =
        profile.level;

    document.getElementById(
        "profileTotal"
    ).textContent =
        totalReps;
}


/*
    Статистика
*/

function updateStats() {

    document.getElementById(
        "todayReps"
    ).textContent =
        todayReps;

    document.getElementById(
        "bestReps"
    ).textContent =
        bestReps;

    document.getElementById(
        "totalReps"
    ).textContent =
        totalReps;
}


/*
    Профильная панель
*/

function openProfile() {

    document.getElementById(
        "profilePanel"
    ).style.display = "flex";

    updateProfileUI();
}


function closeProfile() {

    document.getElementById(
        "profilePanel"
    ).style.display = "none";
}


/* =====================================================
   CAMERA + POSE
   ТЕХНИЧЕСКАЯ ЧАСТЬ СОХРАНЕНА
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const counterElement =
    document.getElementById("counter");

const statusElement =
    document.getElementById("status");

const repAnimation =
    document.getElementById("repAnimation");

const startButton =
    document.getElementById("startButton");


let counter = 0;
let state = "UP";

let cameraStarted = false;
let workoutStarted = false;

let lastRepTime = 0;


/*
    Расстояние
*/

function distance(a, b) {

    return Math.sqrt(
        Math.pow(a.x - b.x, 2) +
        Math.pow(a.y - b.y, 2)
    );
}


/*
    Угол
*/

function angle(a, b, c) {

    const ab = {
        x: a.x - b.x,
        y: a.y - b.y
    };

    const cb = {
        x: c.x - b.x,
        y: c.y - b.y
    };

    const dot =
        ab.x * cb.x +
        ab.y * cb.y;

    const magAB =
        Math.sqrt(
            ab.x ** 2 +
            ab.y ** 2
        );

    const magCB =
        Math.sqrt(
            cb.x ** 2 +
            cb.y ** 2
        );

    if (
        magAB === 0 ||
        magCB === 0
    ) {
        return 180;
    }

    let cos =
        dot /
        (magAB * magCB);

    cos =
        Math.max(
            -1,
            Math.min(1, cos)
        );

    return Math.acos(cos)
        * 180 / Math.PI;
}


/*
    MediaPipe
*/

const pose = new Pose({

    locateFile: (file) => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;

    }

});


pose.setOptions({

    modelComplexity: 1,

    smoothLandmarks: true,

    enableSegmentation: false,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


/*
    Результаты MediaPipe
*/

pose.onResults(results => {

    if (!results.poseLandmarks)
        return;


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
        Скелет
    */

    drawConnectors(
        ctx,
        results.poseLandmarks,
        POSE_CONNECTIONS,
        {
            color: "#00ff66",
            lineWidth: 4
        }
    );


    drawLandmarks(
        ctx,
        results.poseLandmarks,
        {
            color: "#ffffff",
            lineWidth: 2,
            radius: 5
        }
    );


    const p =
        results.poseLandmarks;


    const leftShoulder =
        p[11];

    const rightShoulder =
        p[12];

    const leftElbow =
        p[13];

    const rightElbow =
        p[14];

    const leftWrist =
        p[15];

    const rightWrist =
        p[16];


    const visible =
        leftShoulder.visibility > 0.5 &&
        rightShoulder.visibility > 0.5 &&
        leftElbow.visibility > 0.5 &&
        rightElbow.visibility > 0.5 &&
        leftWrist.visibility > 0.5 &&
        rightWrist.visibility > 0.5;


    if (!visible) {

        statusElement.textContent =
            "Встань дальше от камеры";

        statusElement.className =
            "status";

        return;
    }


    const leftAngle =
        angle(
            leftShoulder,
            leftElbow,
            leftWrist
        );


    const rightAngle =
        angle(
            rightShoulder,
            rightElbow,
            rightWrist
        );


    const elbowAngle =
        (leftAngle + rightAngle) / 2;


    /*
        Если тренировка ещё не начата,
        только показываем готовность.
    */

    if (!workoutStarted) {

        statusElement.textContent =
            "Готов к тренировке";

        statusElement.className =
            "status ready";

        return;
    }


    /*
        Логика отжимания
    */

    if (elbowAngle > 150) {

        if (state === "DOWN") {

            const now =
                Date.now();


            if (
                now - lastRepTime >
                700
            ) {

                counter++;

                counterElement.textContent =
                    counter;

                lastRepTime =
                    now;


                /*
                    Анимация +1
                */

                showRepAnimation();


                /*
                    Обновляем статистику
                */

                todayReps++;
                totalReps++;


                if (
                    counter >
                    bestReps
                ) {

                    bestReps =
                        counter;

                }


                localStorage.setItem(
                    "pushupToday",
                    todayReps
                );

                localStorage.setItem(
                    "pushupTotal",
                    totalReps
                );

                localStorage.setItem(
                    "pushupBest",
                    bestReps
                );


                updateStats();
                updateProfileUI();

            }

            state = "UP";
        }


        statusElement.textContent =
            "⬆️ Вверх";

        statusElement.className =
            "status up";

    }

    else if (elbowAngle < 105) {

        state = "DOWN";

        statusElement.textContent =
            "⬇️ Вниз";

        statusElement.className =
            "status down";

    }

    else {

        statusElement.textContent =
            "Двигайся";

        statusElement.className =
            "status";

    }

});


/*
    Анимация повторения
*/

function showRepAnimation() {

    repAnimation.classList.remove(
        "show"
    );


    counterElement.classList.remove(
        "pop"
    );


    /*
        Перезапуск CSS animation
    */

    void repAnimation.offsetWidth;
    void counterElement.offsetWidth;


    repAnimation.classList.add(
        "show"
    );

    counterElement.classList.add(
        "pop"
    );
}


/*
    Запуск тренировки
*/

async function startWorkout() {

    workoutStarted = true;


    startButton.textContent =
        "Завершить тренировку";

    startButton.classList.add(
        "stop"
    );


    startButton.onclick =
        finishWorkout;


    if (!cameraStarted) {

        await startCamera();

    }


    statusElement.textContent =
        "Готово. Начинай!";
}


/*
    Завершение
*/

function finishWorkout() {

    workoutStarted = false;


    startButton.textContent =
        "Начать тренировку";

    startButton.classList.remove(
        "stop"
    );


    startButton.onclick =
        startWorkout;


    statusElement.textContent =
        `Тренировка завершена: ${counter}`;


    statusElement.className =
        "status ready";
}


/*
    Камера
*/

async function startCamera() {

    if (cameraStarted)
        return;


    try {

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {

                    facingMode: "user",

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        video.srcObject =
            stream;


        cameraStarted =
            true;


        statusElement.textContent =
            "Камера запущена";


        processVideo();


    } catch (error) {

        console.error(error);


        statusElement.textContent =
            "Не удалось получить доступ к камере";

    }
}


/*
    Обработка видео
*/

async function processVideo() {

    if (
        video.readyState >= 2
    ) {

        await pose.send({
            image: video
        });

    }


    requestAnimationFrame(
        processVideo
    );
}


/*
    Сброс текущей тренировки
*/

function resetCounter() {

    counter = 0;

    state = "UP";

    counterElement.textContent =
        "0";


    statusElement.textContent =
        "Счётчик сброшен";

    statusElement.className =
        "status";
}

</script>

</div>

</body>
</html>
